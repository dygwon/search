[project]
name = "locus-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "huggingface-hub>=0.34,<2",
    "pydantic-settings>=2.16.1",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=5.7.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
